# 競輪予想AI 設定ファイル
# このファイルを config.toml という名前でコピーして使います（setup.bat が自動でコピーします）。
# 「#」から後ろはメモ（コメント）なので、動作には影響しません。

[paths]
db = "data/keirin.sqlite"          # データベース（過去レース・仮想購入の記録）
excel = "output/回収率レポート.xlsx"  # 毎日更新されるExcel
model = "data/model.json"          # 学習済みAIの保存先
log = "logs/keirin.log"

[source]
# データの取り先。
#   "sample" : 練習用のダミーデータ（ネット不要）
#   "csv"    : templates フォルダと同じ形式のCSVを inbox フォルダに置いて取り込む
#   "netkeirin": netkeirin から取得（fetch コマンド）。取ったデータは私的利用のみ・公開しないこと
name = "sample"
csv_inbox = "inbox"
# スクレイピング時のマナー設定（サイト用部品で使用）
request_interval_sec = 3.0   # 1回のアクセスごとに最低これだけ待つ（短くしないこと）
user_agent = "keirin-ai-personal/0.1"
cache_dir = "data/cache"     # 取得したページの保存先（途中から再開するときに使う）

[features]
# 設計書「仮の数値」。データを見ながら調整する。
jiriki_threshold = 0.6       # 自力型とみなす自力度（ほかのラインの先行選手の数を数えるとき）
form_days = 90               # 調子を見る期間（日）= 3か月
trend_races = 4              # 調子の上向き度の「直近」何走
race_names_csv = "race_names.csv"  # レース名→格 の対応表（列: race_name,kaku）。無ければ自動判定のみ

[methods]
# 比べる予想方法（設計書「比べる相手」）。人気順はオッズがあれば自動で入る。
compare = ["手作り7:3", "LightGBM", "LightGBM+競走得点"]

[model]
min_train_races = 300        # 本番（daily）で学習するのに必要な最低レース数

[combos]
# 2着・3着の確率の計算補正（1.0 = 標準的なハービル式）。
# 1.0未満にすると、人気薄が2・3着に来る確率を少し高めに見積もる。
lambda2 = 1.0
lambda3 = 1.0

[strategy]
bet_types = ["2車複", "2車単", "3連複"]
stake = 100                  # 1点あたりの仮想購入額（円）

# 「〇〇・本命」: その予想方法で確率が一番高い組み合わせを各券種1点ずつ買う（オッズ不要）
honmei_enabled = true

# 「〇〇・期待値」: 確率×オッズ が min_ev 以上の組み合わせだけ買う（オッズ必要）
ev_enabled = true
min_ev = 1.2
min_prob = 0.02
max_odds = 150.0
max_bets_per_race = 3        # 1レース・1券種あたりの最大点数

# 比較用「人気1位」: 一番オッズが低い組み合わせを各券種1点買う（オッズ必要）
baseline_enabled = true

[schedule]
# predict を実行したとき、発走まで何分以内のレースを対象にするか
predict_window_min = 40
